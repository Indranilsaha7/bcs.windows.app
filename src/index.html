<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCS Enterprise</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Custom Title Bar -->
    <div class="titlebar">
        <div class="titlebar-drag-region"></div>
        <div class="titlebar-title">
            <img src="../al.png" alt="Logo" class="titlebar-icon">
            <span>BCS Enterprise</span>
        </div>
        <div class="titlebar-controls">
            <button class="titlebar-btn" id="btn-minimize">&#x2014;</button>
            <button class="titlebar-btn" id="btn-maximize">&#9723;</button>
            <button class="titlebar-btn close-btn" id="btn-close">&#x2715;</button>
        </div>
    </div>

    <!-- Main Background -->
    <div class="background-container">
        <!-- Floating Glass Login Card -->
        <div class="glass-card">
            <img src="../al.png" alt="BCS Logo" class="logo">
            <h2>BCS ENTERPRISE</h2>
            <p class="subtitle">Secure POS Access</p>
            
            <div class="input-group">
                <label>USERNAME</label>
                <input type="text" id="username" autocomplete="off">
            </div>
            
            <div class="input-group">
                <label>PASSWORD</label>
                <input type="password" id="password">
            </div>

            <div class="input-group">
                <label>SECURITY CODE</label>
                <input type="password" id="code">
            </div>
            
            <button id="btn-login" class="primary-btn">SIGN IN</button>
            
            <div id="status-message" class="status-message"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
