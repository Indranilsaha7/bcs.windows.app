<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <script>
        if (localStorage.getItem('isAuthenticated') !== 'true' || !localStorage.getItem('sessionId') || !localStorage.getItem('sessionPort')) {
            window.location.replace('index.html');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | BCS Enterprise POS</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-content {
            margin-left: 250px; /* Sidebar width */
            padding: 80px 30px 30px 30px; /* Topbar offset */
            transition: all 0.3s ease;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            padding: 24px;
        }

        .glass-table {
            color: #f8fafc;
            vertical-align: middle;
        }
        
        .glass-table th {
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            padding: 16px;
        }

        .glass-table td {
            background: transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px;
        }

        .glass-table tbody tr:hover td {
            background: rgba(255, 255, 255, 0.03);
        }

        .btn-gradient {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border: none;
            color: white;
            transition: opacity 0.2s;
        }
        
        .btn-gradient:hover {
            opacity: 0.9;
            color: white;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.2s;
        }

        /* Modal Styling */
        .modal-content {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
        }
        .modal-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .modal-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .form-control {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }
        .form-control:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: #6366f1;
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
            color: white;
        }
    </style>
</head>
<body>

    <!-- Load Layout Microservices -->
    <script src="template/layout.js"></script>
    <script>
        renderTopbar();
        renderSidebar('products');
    </script>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Products Inventory</h2>
                <p class="text-muted mb-0">Manage your store's products, pricing, and stock.</p>
            </div>
            <button class="btn btn-gradient px-4 py-2 rounded-3 fw-semibold shadow-sm" onclick="openProductModal()">
                <i class="bi bi-plus-lg me-2"></i> Add Product
            </button>
        </div>

        <div class="glass-card">
            <div class="table-responsive">
                <table class="table glass-table mb-0" id="productsTable">
                    <thead>
                        <tr>
                            <th>Product Name</th>
                            <th>Category</th>
                            <th>Sell Price</th>
                            <th>Stock Qty</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody">
                        <tr>
                            <td colspan="5" class="text-center py-4 text-muted">
                                <div class="spinner-border spinner-border-sm me-2" role="status"></div> Loading products...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="productModalTitle">Add New Product</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="productForm">
                        <input type="hidden" id="productId">
                        <div class="mb-3">
                            <label class="form-label text-muted small text-uppercase fw-bold">Product Name</label>
                            <input type="text" class="form-control" id="productName" required placeholder="e.g. Logitech MX Master 3">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small text-uppercase fw-bold">Category</label>
                            <input type="text" class="form-control" id="productCategory" required placeholder="e.g. Electronics">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small text-uppercase fw-bold">Sell Price</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-light">৳</span>
                                    <input type="number" step="0.01" class="form-control" id="productPrice" required placeholder="0.00">
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small text-uppercase fw-bold">Stock Quantity</label>
                                <input type="number" class="form-control" id="productQty" required placeholder="0">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary rounded-3 px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-gradient rounded-3 px-4 fw-semibold" id="saveProductBtn" onclick="saveProduct()">Save Product</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Main Logic -->
    <script type="module">
        import { getCollection, addDocument, updateDocument, deleteDocument } from './script/api.js';
        import { logoutUser } from './script/auth.js';
        window.logoutUser = logoutUser;

        let currentProducts = [];
        let productModalInstance = null;

        // Make functions globally available for inline event handlers
        window.openProductModal = function(id = null) {
            const modalEl = document.getElementById('productModal');
            if (!productModalInstance) {
                productModalInstance = new bootstrap.Modal(modalEl);
            }
            
            const form = document.getElementById('productForm');
            const title = document.getElementById('productModalTitle');
            
            form.reset();
            document.getElementById('productId').value = '';

            if (id) {
                title.textContent = 'Edit Product';
                const product = currentProducts.find(p => p.id === id);
                if (product) {
                    document.getElementById('productId').value = product.id;
                    document.getElementById('productName').value = product.name;
                    document.getElementById('productCategory').value = product.category;
                    document.getElementById('productPrice').value = product.sellPrice;
                    document.getElementById('productQty').value = product.quantity;
                }
            } else {
                title.textContent = 'Add New Product';
            }
            
            productModalInstance.show();
        };

        window.saveProduct = async function() {
            const id = document.getElementById('productId').value;
            const name = document.getElementById('productName').value;
            const category = document.getElementById('productCategory').value;
            const sellPrice = parseFloat(document.getElementById('productPrice').value) || 0;
            const quantity = parseInt(document.getElementById('productQty').value) || 0;

            if (!name || !category) {
                alert("Name and Category are required!");
                return;
            }

            const btn = document.getElementById('saveProductBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Saving...';
            btn.disabled = true;

            try {
                const productData = { name, category, sellPrice, quantity };
                
                if (id) {
                    await updateDocument('products', id, productData);
                } else {
                    // Generate a simple ID for new products
                    productData.id = 'PROD-' + Date.now();
                    await addDocument('products', productData);
                }

                productModalInstance.hide();
                await loadProducts(); // Refresh table
            } catch (error) {
                alert("Error saving product: " + error.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        };

        window.deleteProduct = async function(id) {
            if (confirm("Are you sure you want to delete this product?")) {
                try {
                    await deleteDocument('products', id);
                    await loadProducts();
                } catch (error) {
                    alert("Error deleting product: " + error.message);
                }
            }
        };

        async function loadProducts() {
            const tbody = document.getElementById('productsTableBody');
            try {
                const res = await getCollection('products');
                currentProducts = res.docs.map(d => ({ id: d.id, ...d.data() }));

                if (currentProducts.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-5 text-muted">
                        <i class="bi bi-box-seam fs-1 d-block mb-2"></i>
                        No products found. Click "Add Product" to create one.
                    </td></tr>`;
                    return;
                }

                tbody.innerHTML = currentProducts.map(p => `
                    <tr>
                        <td class="fw-semibold">
                            <div class="d-flex align-items-center gap-3">
                                <div class="bg-dark rounded p-2 border border-secondary" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
                                    <i class="bi bi-box" style="color: #6366f1;"></i>
                                </div>
                                ${p.name || 'Unnamed'}
                            </div>
                        </td>
                        <td><span class="badge bg-dark border border-secondary text-light px-2 py-1">${p.category || '-'}</span></td>
                        <td class="text-success fw-bold">৳${(p.sellPrice || 0).toFixed(2)}</td>
                        <td>
                            <span class="badge ${p.quantity > 5 ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'} rounded-pill px-3">
                                ${p.quantity || 0} in stock
                            </span>
                        </td>
                        <td class="text-end">
                            <button class="btn btn-outline-info action-btn me-1" onclick="openProductModal('${p.id}')">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-outline-danger action-btn" onclick="deleteProduct('${p.id}')">
                                <i class="bi bi-trash3"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');

            } catch (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4"><i class="bi bi-exclamation-triangle"></i> Error loading products: ${error.message}</td></tr>`;
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
