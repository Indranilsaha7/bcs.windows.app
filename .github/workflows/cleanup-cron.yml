name: Database Cleanup Cron
on:
  schedule:
    # Runs at 12:00 PM UTC every day
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cleanup Endpoint
        run: |
          # Replace with your actual production URL once deployed
          curl -X GET "https://YOUR_CLOUDFLARE_PAGES_URL/api/cron/cleanup"
