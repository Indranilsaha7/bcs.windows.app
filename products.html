<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products</title>
    <link rel="icon" href="images/logo/logo.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Global Components (Correct paths for Windows App) -->
    <link rel="stylesheet" href="template/topbar/topbar.css">
    <link rel="stylesheet" href="template/sidebar/sidebar.css">
    <link rel="stylesheet" href="template/alert/alert.css">

    <style>
        /* macOS Sleek Glassmorphism Variables */
        :root {
            --bs-primary-rgb: 99, 102, 241;
            --bs-primary: #6366f1;
            --bs-body-font-family: 'Inter', sans-serif;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-bg-hover: rgba(255, 255, 255, 0.85);
            --glass-border: 1px solid rgba(255, 255, 255, 0.8);
            --glass-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            --glass-shadow-hover: 0 15px 40px rgba(0, 0, 0, 0.08);
            --glass-blur: blur(16px);
            --page-bg: #f3f4f6;
            --orb-1: rgba(99, 102, 241, 0.3);
            --orb-2: rgba(168, 85, 247, 0.25);
        }

        [data-bs-theme="dark"] {
            --glass-bg: rgba(30, 30, 30, 0.55);
            --glass-bg-hover: rgba(45, 45, 45, 0.65);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            --glass-shadow-hover: 0 15px 40px rgba(0, 0, 0, 0.4);
            --page-bg: #111827;
            --orb-1: rgba(99, 102, 241, 0.15);
            --orb-2: rgba(168, 85, 247, 0.15);
        }

        body {
            font-family: var(--bs-body-font-family);
            background: var(--page-bg) !important;
            background-attachment: fixed !important;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
            z-index: 0;
            color: var(--bs-body-color);
        }

        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            z-index: -1;
            filter: blur(80px);
            pointer-events: none;
        }

        body::before {
            width: 500px;
            height: 500px;
            background: var(--orb-1);
            top: -150px;
            left: -100px;
        }

        body::after {
            width: 400px;
            height: 400px;
            background: var(--orb-2);
            bottom: -50px;
            right: -50px;
        }

        .main-content {
            margin-left: 240px; /* Leave space for sidebar */
            padding-top: 72px;
            flex-grow: 1;
            padding-bottom: 40px;
            padding-right: 20px;
            padding-left: 20px;
        }

        .product-card {
            background: var(--glass-bg) !important;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: var(--glass-border) !important;
            box-shadow: var(--glass-shadow) !important;
            transition: all 0.3s ease-in-out;
            border-radius: 20px;
            overflow: hidden;
            color: var(--bs-body-color);
        }

        .product-card:hover {
            transform: translateY(-4px);
            background: var(--glass-bg-hover) !important;
            box-shadow: var(--glass-shadow-hover) !important;
        }

        .stat-card {
            background: var(--glass-bg) !important;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: var(--glass-border) !important;
            border-radius: .75rem;
            box-shadow: var(--glass-shadow) !important;
            transition: all 0.3s ease-in-out;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            background: var(--glass-bg-hover) !important;
            box-shadow: var(--glass-shadow-hover) !important;
        }

        .stat-card .card-body {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: transparent !important;
        }

        .stat-card .icon-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass-bg);
            border: var(--glass-border);
            box-shadow: var(--glass-shadow) !important;
        }

        .product-card img {
            height: 200px;
            object-fit: contain;
            background-color: #ffffff;
            border-radius: 20px 20px 0 0;
        }

        [data-bs-theme="dark"] .product-card img {
            border-radius: 20px 20px 0 0;
            background-color: var(--bs-gray-200);
        }

        .product-card .card-body {
            position: relative;
            padding: 1.5rem;
        }

        .card-actions {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            gap: 0.5rem;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
        }

        .product-card:hover .card-actions {
            opacity: 1;
        }

        .card-actions .btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .list-group-item {
            background-color: transparent !important;
            border-color: var(--bs-border-color-translucent) !important;
            padding-left: 0;
            padding-right: 0;
            color: inherit;
        }

        /* Sidebar styles compatibility */
        .sidebar {
            position: fixed; left: 0; top: 0; bottom: 0; width: 220px;
            background: rgba(20, 20, 25, 0.8); backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; flex-direction: column; z-index: 1000;
        }
        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .sidebar-menu { padding: 15px 10px; display: flex; flex-direction: column; gap: 5px; flex-grow: 1; overflow-y: auto; }
        .menu-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #888899;
            text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: 500; transition: all 0.2s ease;
        }
        .menu-item:hover, .menu-item.active { background: rgba(255, 255, 255, 0.05); color: #fff; }
        
        .modal-content {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: var(--glass-border);
            color: var(--bs-body-color);
        }
    </style>
</head>

<body data-bs-theme="dark">

    
    

    <main class="main-content">
        <div class="container-fluid px-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
                <h1 class="h2">Product List</h1>
                <div>
                    <a href="stock-adjust-history.html" class="btn btn-outline-primary me-2">
                        <i class="bi bi-clock-history me-1"></i> Stock History
                    </a>
                    <button id="printFullReportBtn" class="btn btn-secondary">
                        <i class="bi bi-printer-fill me-2"></i> Print Full List
                    </button>
                    <button class="btn btn-success ms-2" onclick="window.location.href='add-product.html'">
                        <i class="bi bi-plus-lg me-1"></i> Add Product
                    </button>
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="row mb-4">
                <div class="col-md-3 mb-3">
                    <div class="card stat-card bg-primary-subtle text-primary-emphasis h-100">
                        <div class="card-body">
                            <div>
                                <h6 class="card-title text-uppercase small">Total Products</h6>
                                <h3 class="fw-bold mb-0" id="totalProductsCard">0</h3>
                            </div>
                            <div class="icon-circle bg-primary text-white"><i class="bi bi-box-seam"></i></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="card stat-card bg-success-subtle text-success-emphasis h-100">
                        <div class="card-body">
                            <div>
                                <h6 class="card-title text-uppercase small">In Stock</h6>
                                <h3 class="fw-bold mb-0" id="inStockCountCard">0</h3>
                            </div>
                            <div class="icon-circle bg-success text-white"><i class="bi bi-check-circle"></i></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="card stat-card bg-danger-subtle text-danger-emphasis h-100">
                        <div class="card-body">
                            <div>
                                <h6 class="card-title text-uppercase small">Out of Stock</h6>
                                <h3 class="fw-bold mb-0" id="outOfStockCountCard">0</h3>
                            </div>
                            <div class="icon-circle bg-danger text-white"><i class="bi bi-x-circle"></i></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="card stat-card bg-warning-subtle text-warning-emphasis h-100">
                        <div class="card-body">
                            <div>
                                <h6 class="card-title text-uppercase small">Low Stock Alert</h6>
                                <h3 class="fw-bold mb-0" id="stockAlertCountCard">0</h3>
                            </div>
                            <div class="icon-circle bg-warning text-white"><i class="bi bi-exclamation-triangle"></i></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Search & Filters -->
            <div class="row mb-4">
                <div class="col-lg-10 offset-lg-1">
                    <div class="input-group input-group-lg" style="box-shadow: var(--glass-shadow); border-radius: 12px; overflow: hidden; border: var(--glass-border);">
                        <select id="sortBy" class="form-select border-0" style="max-width: 220px; background: var(--glass-bg); backdrop-filter: var(--glass-blur); color: var(--bs-body-color);">
                            <option value="name-asc" selected>Sort by Name (A-Z)</option>
                            <option value="name-desc">Sort by Name (Z-A)</option>
                            <option value="in-stock-only">Only In Stock</option>
                            <option value="out-of-stock-only">Out of Stock</option>
                            <option value="alert-only">Low Stock Alerts</option>
                        </select>
                        <input type="search" id="productSearch" class="form-control border-0"
                            placeholder="Search by name, barcode, category..." style="background: var(--glass-bg); backdrop-filter: var(--glass-blur); color: var(--bs-body-color);">
                    </div>
                </div>
            </div>
            
            <div class="row" id="productList">
                <div class="text-center w-100 py-5" id="loadingSpinner">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>

            <div id="noProductsMessage" class="text-center py-5" style="display: none;">
                <h2 class="mt-3">No Products Found</h2>
                <p class="lead text-muted">Click "Add Product" on the Navigation to get started.</p>
            </div>
        </div>
    </main>

    <!-- Details Modal -->
    <div class="modal fade" id="productDetailsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title">Product Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="productDetailsContainer"></div>
                </div>
                <div class="modal-footer border-top border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

        <script src="template/layout.js"></script>
    <script src="template/topbar/topbar.js"></script>
    <script src="template/api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Render Template UI
        renderTopbar();
        renderSidebar('products');
        renderFooter();
        let allProducts = [];
        let filteredProducts = [];
        const formatCurrency = (amt) => `₹ ${Number(amt).toFixed(2)}`;

        document.addEventListener('DOMContentLoaded', async () => {
            await loadProducts();
            
            document.getElementById('productSearch').addEventListener('input', filterAndSortProducts);
            document.getElementById('sortBy').addEventListener('change', filterAndSortProducts);
        });

        async function loadProducts() {
            try {
                const res = await fetchAPI('/api/database/data-manager?table=products');
                if (res.success) {
                    allProducts = res.data;
                    updateSummaryStats();
                    filterAndSortProducts();
                }
            } catch (err) {
                console.error("Failed to load products", err);
                document.getElementById('loadingSpinner').style.display = 'none';
            }
        }

        function updateSummaryStats() {
            document.getElementById('totalProductsCard').textContent = allProducts.length;
            document.getElementById('inStockCountCard').textContent = allProducts.filter(p => (p.quantity || 0) > 0).length;
            document.getElementById('outOfStockCountCard').textContent = allProducts.filter(p => (p.quantity || 0) <= 0).length;
            document.getElementById('stockAlertCountCard').textContent = allProducts.filter(p => (p.quantity || 0) <= (p.alertQuantity || 0)).length;
        }

        function filterAndSortProducts() {
            const searchTerm = document.getElementById('productSearch').value.toLowerCase().trim();
            const sortBy = document.getElementById('sortBy').value;

            filteredProducts = allProducts.filter(product => {
                const searchStr = `${product.name} ${product.barcode} ${product.category}`.toLowerCase();
                if (searchTerm && !searchStr.includes(searchTerm)) return false;

                if (sortBy === 'in-stock-only') return (product.quantity || 0) > 0;
                if (sortBy === 'out-of-stock-only') return (product.quantity || 0) <= 0;
                if (sortBy === 'alert-only') return (product.quantity || 0) <= (product.alertQuantity || 0);

                return true;
            });

            if (!['in-stock-only', 'out-of-stock-only', 'alert-only'].includes(sortBy)) {
                filteredProducts.sort((a, b) => {
                    if (sortBy === 'name-asc') return (a.name||'').localeCompare(b.name||'');
                    if (sortBy === 'name-desc') return (b.name||'').localeCompare(a.name||'');
                    return 0;
                });
            }

            renderProducts(filteredProducts);
        }

        function renderProducts(productsToRender) {
            const container = document.getElementById('productList');
            const noMsg = document.getElementById('noProductsMessage');
            document.getElementById('loadingSpinner').style.display = 'none';

            if (productsToRender.length === 0) {
                container.innerHTML = '';
                noMsg.style.display = 'block';
                return;
            } else {
                noMsg.style.display = 'none';
            }

            let cardsHtml = '';
            productsToRender.forEach(product => {
                const qty = product.quantity || 0;
                const alertQty = product.alertQuantity || 0;
                
                let borderColor = '#32cd32';
                if (qty <= 0) borderColor = '#ff1a1a';
                else if (qty <= alertQty) borderColor = '#ffe600';

                cardsHtml += `
                    <div class="col-md-6 col-lg-4 mb-4">
                        <div class="card product-card h-100" style="border: 2px solid ${borderColor} !important; box-shadow: 0 8px 32px ${borderColor}30 !important;">
                            <div class="position-relative">
                                <img src="${product.imageUrl || 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZWVlIi8+PHRleHQgeD0iNTAiIHk9IjUwIiBmb250LXNpemU9IjEyIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjOTk5Ij5ObyBJbWFnZTwvdGV4dD48L3N2Zz4='}" class="card-img-top" alt="${product.name}">
                            </div>
                            <div class="card-body d-flex flex-column">
                                <div class="card-actions">
                                    <button class="btn btn-sm btn-success details-btn" onclick="showProductDetails('${product.id}')" title="View Details">
                                        <i class="bi bi-eye-fill"></i>
                                    </button>
                                    <button class="btn btn-sm btn-warning edit-btn" title="Edit Product">
                                        <i class="bi bi-pencil-square"></i>
                                    </button>
                                </div>
                                <h5 class="card-title fw-bold">${product.name}</h5>
                                <p class="card-text text-muted small">${product.brand || 'No Brand'}</p>
                                <ul class="list-group list-group-flush mt-auto">
                                    <li class="list-group-item d-flex justify-content-between border-secondary border-opacity-25"><span>Barcode:</span> <strong>${product.barcode || 'N/A'}</strong></li>
                                    <li class="list-group-item d-flex justify-content-between border-secondary border-opacity-25"><span>Quantity:</span> <strong>${qty} ${product.unit || 'Pcs'}</strong></li>
                                    <li class="list-group-item d-flex justify-content-between pt-3 border-secondary border-opacity-25"><span>Buy Price:</span> <strong>${formatCurrency(product.buy_price)}</strong></li>
                                    <li class="list-group-item d-flex justify-content-between border-secondary border-opacity-25"><span>Wholesale Price:</span> <strong>${formatCurrency(product.wholesale_price)}</strong></li>
                                    <li class="list-group-item d-flex justify-content-between border-secondary border-opacity-25"><span>Sell Price:</span> <strong>${formatCurrency(product.sell_price)}</strong></li>
                                </ul>
                            </div>
                        </div>
                    </div>`;
            });
            container.innerHTML = cardsHtml;
        }

        window.showProductDetails = function(productId) {
            const product = allProducts.find(p => String(p.id) === String(productId));
            if (!product) return;

            const modalBody = `
                <div class="row">
                    <div class="col-md-4 text-center">
                        <img src="${product.imageUrl || 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZWVlIi8+PHRleHQgeD0iNTAiIHk9IjUwIiBmb250LXNpemU9IjEyIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjOTk5Ij5ObyBJbWFnZTwvdGV4dD48L3N2Zz4='}" class="img-fluid rounded mb-3 bg-white" alt="${product.name}">
                    </div>
                    <div class="col-md-8">
                        <h3>${product.name}</h3>
                        <p class="text-muted">${product.description || 'No description available.'}</p>
                        <ul class="list-group list-group-flush" style="background:transparent;">
                            <li class="list-group-item d-flex justify-content-between border-secondary border-opacity-25"><span>Category:</span> <strong>${product.category || 'N/A'}</strong></li>
                            <li class="list-group-item d-flex justify-content-between border-secondary border-opacity-25"><span>Brand:</span> <strong>${product.brand || 'N/A'}</strong></li>
                            <li class="list-group-item d-flex justify-content-between border-secondary border-opacity-25"><span>Barcode:</span> <strong>${product.barcode || 'N/A'}</strong></li>
                            <li class="list-group-item d-flex justify-content-between border-secondary border-opacity-25"><span>Unit:</span> <strong>${product.unit || 'N/A'}</strong></li>
                            <li class="list-group-item d-flex justify-content-between border-secondary border-opacity-25"><span>Current Stock:</span> <strong>${product.quantity || 0}</strong></li>
                            <li class="list-group-item d-flex justify-content-between border-secondary border-opacity-25"><span>Alert Quantity:</span> <strong>${product.alertQuantity || 0}</strong></li>
                        </ul>
                    </div>
                </div>
                <hr class="border-secondary">
                <h5 class="mt-4">Pricing</h5>
                <div class="row text-center">
                    <div class="col-3"><div class="p-2 bg-secondary bg-opacity-25 text-white rounded"><h6>Buy Price</h6><p class="fs-5 mb-0">${formatCurrency(product.buy_price)}</p></div></div>
                    <div class="col-3"><div class="p-2 bg-primary bg-opacity-25 text-white rounded"><h6>Wholesale</h6><p class="fs-5 mb-0">${formatCurrency(product.wholesale_price)}</p></div></div>
                    <div class="col-3"><div class="p-2 bg-info bg-opacity-25 text-white rounded"><h6>Shop Sell</h6><p class="fs-5 mb-0">${formatCurrency(product.shop_sell_price)}</p></div></div>
                    <div class="col-3"><div class="p-2 bg-success bg-opacity-25 text-white rounded"><h6>Retail Sell</h6><p class="fs-5 mb-0">${formatCurrency(product.sell_price)}</p></div></div>
                </div>
            `;

            document.getElementById('productDetailsContainer').innerHTML = modalBody;
            const modal = new bootstrap.Modal(document.getElementById('productDetailsModal'));
            modal.show();
        };
    </script>
</body>
</html>
