<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Global Components -->
    <link rel="stylesheet" href="template/topbar/topbar.css">
    <link rel="stylesheet" href="template/sidebar/sidebar.css">
    <link rel="stylesheet" href="template/alert/alert.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Page Specific Styles -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        .page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 25px; }
        .page-title h1 { color: #fff; font-size: 24px; font-weight: 700; margin-bottom: 2px; }
        .page-title p { color: #888899; font-size: 13px; }

        /* Dense, Colorful Stats Grid (Matching Image 2) */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px; /* Tighter gap */
            margin-bottom: 15px;
        }

        .stat-card {
            border-radius: 10px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            color: white;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
        }

        .stat-info { display: flex; flex-direction: column; gap: 5px; }
        
        .stat-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
        }
        .stat-icon svg { width: 20px; height: 20px; fill: #fff; }

        /* Background Color Classes matching Old Dashboard */
        .bg-green { background: #0c3620; } /* Total Sale, In Stock */
        .bg-red { background: #4a1515; } /* Total Purchase, Out of Stock */
        .bg-teal { background: #0b3d4a; } /* Total Sales Count, Categories */
        .bg-blue { background: #12284a; } /* Net Profit, Total Orders, Total Products */
        .bg-yellow { background: #5a4200; } /* Sale Due, Stock Alert */
        .bg-grey { background: #2a2a2a; } /* Purchase Due, Suppliers, Customers */

        /* Header Actions */
        .header-actions { display: flex; gap: 15px; }
        .btn { padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; display: flex; align-items: center; gap: 8px; }
        .btn-primary { background: #6C63FF; color: white; }
    </style>
</head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    <script src="template/alert/alert.js"></script>
    <script src="template/topbar/topbar.js"></script>
    <script src="template/api.js"></script>
    <script>
        const sessionJson = localStorage.getItem('userSession');
        if (!sessionJson) window.location.href = 'index.html';
        
        const user = JSON.parse(sessionJson);
        const nameEl = document.getElementById('nav-username');
        if (nameEl) nameEl.textContent = user.username;
        const roleEl = document.getElementById('nav-role');
        if (roleEl) roleEl.textContent = user.role;
        const avatarEl = document.getElementById('nav-avatar');
        if (avatarEl) avatarEl.textContent = user.username.charAt(0).toUpperCase();
        const topbarUserEl = document.getElementById('nav-username-tb');
        async function loadProducts(searchQuery = '') {
            const list = document.getElementById('product-list');
            try {
                const endpoint = searchQuery ? '/api/database/data-manager?table=products&q=' + encodeURIComponent(searchQuery) : '/api/database/data-manager?table=products';
                const res = await fetchAPI(endpoint);
                if (!res || !res.success) throw new Error('API Error');
                const products = res.data;
                
                if (products.length === 0) {
                    list.innerHTML = '<tr><td colspan="6" style="padding: 20px; text-align: center; color: #666;">No products found in Cloudflare.</td></tr>';
                    return;
                }
                
                let html = '';
                products.forEach(p => {
                    const stockColor = p.quantity <= 0 ? '#ff8a8a' : '#81c784';
                    html += '<tr style="border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.2s;">' +
                            '<td style="padding: 12px; font-size: 13px;">' + (p.barcode || 'N/A') + '</td>' +
                            '<td style="padding: 12px; font-size: 14px; font-weight: 500;">' + p.name + '</td>' +
                            '<td style="padding: 12px; font-size: 13px; color: #aaa;">' + p.category + '</td>' +
                            '<td style="padding: 12px; font-size: 14px;">â‚¹' + Number(p.sell_price || 0).toFixed(2) + '</td>' +
                            '<td style="padding: 12px; font-size: 14px; color: ' + stockColor + '; font-weight: 600;">' + p.quantity + '</td>' +
                            '<td style="padding: 12px;"><button class="tb-btn tb-btn-info" style="padding: 4px 8px;">Edit</button></td></tr>';
                });
                list.innerHTML = html;
            } catch(e) {
                console.error(e);
                list.innerHTML = '<tr><td colspan="6" style="padding: 20px; text-align: center; color: #ff8a8a;">Network read error.</td></tr>';
            }
        }

        document.getElementById('search-product').addEventListener('input', (e) => loadProducts(e.target.value));
        loadProducts();
    </script>
