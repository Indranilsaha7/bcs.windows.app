<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCS Enterprise - Login</title>
    
    <!-- Global Components -->
    <link rel="stylesheet" href="template/topbar/topbar.css">
    <link rel="stylesheet" href="template/alert/alert.css">
    
    <!-- Google Fonts for Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Page Specific Styles -->
    <style>
        :root {
            --primary: #0A84FF; /* Apple-style vibrant blue */
            --primary-hover: #0070DF;
            --bg-dark: #000000;
            --text-main: #FFFFFF;
            --text-muted: #8E8E93;
            --input-bg: rgba(255, 255, 255, 0.08);
            --input-border: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
        }

        /* Main Background - Kept ORIGINAL without blur or darkening overlay */
        .background-container {
            height: 100vh;
            padding-top: 30px; 
            box-sizing: border-box;
            background-image: url('bg-walpaper.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Dark Overlay has been removed from here --- */

        /* Semi-Transparent Card - BLUR REMOVED for original background clarity */
        .glass-card {
            position: relative;
            z-index: 2;
            width: 420px;
            border-radius: 30px;
            padding: 50px 45px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            
            /* Sightly higher opacity for readability now that the card is sharp */
            background: rgba(25, 25, 30, 0.85); 
            
            /* --- Backdrop blurs removed below --- */
            /* backdrop-filter: blur(35px); */
            /* -webkit-backdrop-filter: blur(35px); */
            
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes slideUpFade {
            0% { transform: translateY(40px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .logo {
            width: 75px;
            margin-bottom: 24px;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4));
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        h2 {
            color: var(--text-main);
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 400;
            margin-top: 6px;
            margin-bottom: 45px;
        }

        /* Sleek Input Fields */
        .input-group {
            width: 100%;
            margin-bottom: 20px;
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: var(--text-muted);
            transition: fill 0.3s ease;
            pointer-events: none;
        }

        .input-group input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 14px;
            padding: 16px 16px 16px 50px;
            color: var(--text-main);
            font-size: 15px;
            font-weight: 500;
            outline: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .input-group input::placeholder {
            color: rgba(255,255,255,0.4);
            font-weight: 400;
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.2);
        }

        .input-group input:focus + .input-icon {
            fill: var(--primary);
        }

        /* Interactive Primary Button */
        .primary-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .primary-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(10, 132, 255, 0.35);
        }

        .primary-btn:active {
            transform: translateY(1px);
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            position: absolute;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-text {
            transition: opacity 0.2s ease;
        }

        .is-loading .btn-text {
            opacity: 0;
        }

        .is-loading .spinner {
            display: block;
        }

    </style>
</head>
<body>
    
    <!-- VS Code Style Topbar HTML -->
    <div class="titlebar">
        <div class="titlebar-drag-region"></div>
        <div class="titlebar-left">
            <img src="al.png" alt="Logo" class="titlebar-icon">
            <div class="titlebar-menu">
                <div class="menu-item">File</div>
                <div class="menu-item">Edit</div>
                <div class="menu-item">View</div>
                <div class="menu-item">Help</div>
            </div>
        </div>
        <div class="titlebar-center" style="position: absolute; left: 50%; transform: translateX(-50%);">
            <span>BCS Enterprise POS</span>
        </div>
    </div>

    <!-- Main Page Content -->
    <div class="background-container">
        <div class="glass-card">
            <img src="al.png" alt="BCS Logo" class="logo">
            <h2>BCS ENTERPRISE</h2>
            <p class="subtitle">Secure POS Access</p>
            
            <div class="input-group">
                <input type="text" id="username" placeholder="Username" autocomplete="off">
                <!-- User Icon -->
                <svg class="input-icon" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" placeholder="Password">
                <!-- Lock Icon -->
                <svg class="input-icon" viewBox="0 0 24 24">
                    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/>
                </svg>
            </div>

            <div class="input-group">
                <input type="password" id="code" placeholder="Security Code">
                <!-- Shield Icon -->
                <svg class="input-icon" viewBox="0 0 24 24">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                </svg>
            </div>
            
            <button id="btn-login" class="primary-btn">
                <span class="btn-text">SIGN IN</span>
                <div class="spinner"></div>
            </button>
        </div>
    </div>

    <!-- Global Component Scripts -->
    <script src="template/topbar/topbar.js"></script>
    <script src="template/alert/alert.js"></script>
    
    <!-- Page Specific Scripts -->
    <script>
        document.getElementById('btn-login').addEventListener('click', function() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const code = document.getElementById('code').value;
            const btn = this;

            if (!username || !password || !code) {
                showAlert('error', 'Authentication Failed', 'All fields are required to proceed.');
                return;
            }

            // Start loading animation
            btn.classList.add('is-loading');
            btn.disabled = true;

            // Simulate authentication process
            setTimeout(() => {
                btn.classList.remove('is-loading');
                showAlert('success', 'Access Granted', `Authentication successful. Welcome, ${username}!`);
                
                setTimeout(() => {
                    btn.disabled = false;
                }, 2000);
            }, 1800);
        });
    </script>
</body>
</html>
